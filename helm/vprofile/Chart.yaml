apiVersion: v2
name: vprofile
description: A Helm chart for VProfile application
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: frost4190
    email: frost4190@example.com
dependencies:
  - name: mysql
    version: 9.4.6
    repository: https://charts.bitnami.com/bitnami
    condition: mysql.enabled
  - name: memcached
    version: 6.2.5
    repository: https://charts.bitnami.com/bitnami
    condition: memcached.enabled
  - name: rabbitmq
    version: 11.1.3
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled